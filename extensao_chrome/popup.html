<!DOCTYPE html>
<html>
<head>
  <title>Avaliador Airbnb</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 300px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #avaliar {
      padding: 8px 16px;
      background-color: #ff5a5f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    #avaliar:hover {
      background-color: #e0484d;
    }

    .resumo {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
    }

    .resumo p {
      margin: 6px 0;
    }

    #abrirDetalhes {
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    #abrirDetalhes a {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }

    #abrirDetalhes a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Avaliar Preço</h1>
  <button id="avaliar">Avaliar</button>
  <div id="resultado" class="resumo"></div>
  <div id="abrirDetalhes"><a target="_blank" id="detalhesLink">Ver mais detalhes</a></div>

  <script src="popup.js"></script>
</body>
</html>
